# features.yaml - Subagent and RAG Feature Controls for KP Education Laws Assistant
# Toggle features on/off or adjust thresholds dynamically without code changes.

features:
  # Subagent 1: Request Evaluator & Query Classifier
  # Classifies user query (STATUTORY_QUERY, GREETING_CHITCHAT, OUT_OF_SCOPE, CLARIFICATION_NEEDED)
  # When disabled, all user inputs pass directly to the agent/retriever.
  enable_request_evaluator: true

  # Vector Search Tool: Query Rewriter
  # Rewrites user query into up to 3 legal search variants to improve statutory coverage
  # When disabled, only the raw user query is searched against the vector database.
  enable_query_rewriter: true

  # Vector Search Tool: Maximal Marginal Relevance (MMR)
  # Reranks candidate vectors balancing relevance and diversity to prevent redundant chunks
  # When disabled, simple similarity top-k ranking is used.
  enable_mmr_retrieval: true

  # Subagent 2: Response Verifier
  # Verifies candidate answers for faithfulness, citation accuracy (Title, Year, Section, Page),
  # and negative retrieval enforcement ("Not found in the KP laws provided.")
  # When disabled, the first generated answer is returned immediately.
  enable_response_verifier: true

  # Semantic Query Cache
  # Caches verified answers in dedicated Qdrant collection 'kp_laws_cache'
  enable_semantic_cache: true

  # Subagent & Retrieval Parameters
  max_query_variants: 3         # Max query variants generated by QueryRewriter (including original)
  max_verification_retries: 2   # Maximum refinement attempts if verification fails
  mmr_diversity_lambda: 0.7     # MMR factor (1.0 = purely relevant, 0.0 = purely diverse)
  retrieval_limit: 5            # Number of statutory chunks to provide to the agent

