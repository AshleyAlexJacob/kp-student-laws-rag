[project]
name = "kp-laws-agent"
version = "0.1.0"
description = "KP Education Laws RAG Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "qdrant-client>=1.20.0",
    "openai>=3.42.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.14.2",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kp_agent"]
